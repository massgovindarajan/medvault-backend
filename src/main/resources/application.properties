# ===============================
# SERVER
# ===============================
# Railway injects PORT automatically \u2014 fallback to 8081 for local Docker
server.port=${PORT:8081}
server.address=0.0.0.0

spring.application.name=MEDVAULT-BACKEND

# ===============================
# DATABASE (MySQL)
# ===============================
# ===============================
# DATABASE (MySQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:KNURKFMRZJRcKMSkONtaJANvxPKnRIoO}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# HIKARI CONNECTION POOL
# ===============================
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=MedVaultPool

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:medvault_super_secret_key_2024_should_be_very_long_for_security}
app.jwt.expiration=86400000

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads/

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,https://medical-six-dun.vercel.app,https://medical-65ek7uigk-massgovindarajans-projects.vercel.app}

# ===============================
# LOGGING
# ===============================
logging.level.com.medvault=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ===============================
# EUREKA CLIENT
# ===============================
# Local Docker   \u2192 defaults to http://eureka-server:8761/eureka/
# Railway        \u2192 set EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE in Railway Variables tab
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=30
eureka.client.eureka-server-connect-timeout-seconds=10
eureka.client.eureka-server-read-timeout-seconds=10

# Local Docker   \u2192 prefer-ip-address=true, hostname=localhost
# Railway        \u2192 set EUREKA_INSTANCE_HOSTNAME=medvault-backend.up.railway.app
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.non-secure-port=${PORT:8081}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===============================
# RAZORPAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SuT1Xgqp33FKBR}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:mN3c7UitMALD5kKih2AkxZof}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:test_secret}
razorpay.currency=INR
